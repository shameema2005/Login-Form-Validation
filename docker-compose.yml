services:
  web:
    build: .
    ports:
      - "8085:80"
    container_name: login-validation-web
  selenium:
    image: selenium/standalone-chrome:4.27.0
    shm_size: 2gb
    ports:
      - "4444:4444"
    depends_on:
      - web
  tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    environment:
      BASE_URL: http://web
      SELENIUM_URL: http://selenium:4444/wd/hub
    depends_on:
      - web
      - selenium
